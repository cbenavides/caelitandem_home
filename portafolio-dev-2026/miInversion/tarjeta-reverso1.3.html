<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{ width:1050px; height:600px; background:#ffffff; font-family:'Inter',sans-serif; }
  .card{ width:1050px; height:600px; position:relative; overflow:hidden; background:#ffffff; }
  
  /* Cohesión de fondo: Doble resplandor igual que el anverso */
  .cb-glow-bottom {
    position: absolute;
    bottom: -40px;
    right: -40px;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, #e8edf8 0%, transparent 70%);
    opacity: .9;
    pointer-events: none;
  }
  .cb-glow-top {
    position: absolute;
    top: -60px;
    left: -60px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, #f0f3fc 0%, transparent 70%);
    opacity: .75;
    pointer-events: none;
  }

  .back-body{
    position:absolute; top:20px; left:30px; right:30px; bottom:20px;
    display:flex; flex-direction:column; justify-content:center; gap:22px;
  }
  
  /* Títulos en Azul Marino Premium */
  .section-label{
    font-size: 26px; font-weight: 700; color: #1c2340; letter-spacing: .14em;
    text-transform: uppercase; margin-bottom: 3px; text-align: center;
  }
  .section-divider{ display: flex; align-items: center; gap: 15px; margin: 16px 0; }
  .section-divider .line{ flex: 1; height: 1.5px; background: #b0c2f2; }
  .section-divider .label{
    font-size: 26px; font-weight: 700; color: #1c2340; letter-spacing: .14em; text-transform: uppercase;
  }
  
  .pill-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  
  /* Servicios: Borde fino con texto marino */
  .pill-s{
    font-size: 24.5px; font-weight: 500; color: #1c2340; background: transparent;
    border: 1.5px solid #8ba4e6; border-radius: 14px; padding: 12px 14px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    white-space: nowrap; letter-spacing: 0.01em;
  }
  /* Íconos con acento Azul Cobalto Eléctrico */
  .pill-icon{
    width: 28px; height: 28px; stroke: #3b5bdb; stroke-width: 2.6;
    stroke-linecap: round; stroke-linejoin: round; fill: none; flex-shrink: 0;
  }
  
  /* Sectores: Badges con fondo sólido suave y texto marino destacado */
  .pill-v{
    font-size: 25px; font-weight: 600; color: #1c2340; background: #f0f4ff;
    border: 1.5px solid #c3daff; border-radius: 14px; padding: 12px 14px;
    text-align: center; white-space: nowrap; letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="cb-glow-top"></div>
    <div class="cb-glow-bottom"></div>
    <div class="back-body">
      <div class="section-label">Servicios</div>
      <div class="pill-grid">
        <span class="pill-s">
          <svg class="pill-icon" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
          Software a medida
        </span>
        <span class="pill-s">
          <svg class="pill-icon" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
          Comandas por Voz
        </span>
        <span class="pill-s">
          <svg class="pill-icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          Reportes y tableros
        </span>
        <span class="pill-s">
          <svg class="pill-icon" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"></path></svg>
          Migración y limpieza de datos
        </span>
        <span class="pill-s">
          <svg class="pill-icon" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          Modernización de Excel a WebApps
        </span>
        <span class="pill-s">
          <svg class="pill-icon" viewBox="0 0 24 24"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line><polygon points="12 22.08 12 12 3 6.81 3 17.22 12 22.08"></polygon><polygon points="12 22.08 21 17.22 21 6.81 12 12 12 22.08"></polygon><polygon points="12 12 3 6.81 12 1.58 21 6.81 12 12"></polygon></svg>
          Logística e inventarios predictivos
        </span>
      </div>
 
      <div class="section-divider">
        <div class="line"></div>
        <div class="label">Sectores</div>
        <div class="line"></div>
      </div>
 
      <div class="pill-grid" style="grid-template-columns: 0.8fr 0.6fr 1.6fr;">
        <span class="pill-v">Cajas de ahorro</span>
        <span class="pill-v">Clínicas</span>
        <span class="pill-v">Agua Potable y Alcantarillado</span>
        <span class="pill-v">Purificadoras</span>
        <span class="pill-v">Abarroteras</span>
        <span class="pill-v">Punto de venta a medida</span>
      </div>
    </div>
  </div>
</body>
</html>
