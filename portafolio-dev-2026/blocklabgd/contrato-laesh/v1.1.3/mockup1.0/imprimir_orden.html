<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Impresión de Orden - LAESH</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --primary-color: #0f766e; /* Teal 700 */
            --primary-hover: #115e59; /* Teal 800 */
            --primary-light: #14b8a6; /* Teal 500 */
            --danger-color: #edf2f7;
            --danger-hover: #e2e8f0;
            --text-dark: #0f172a;
            --border-guide: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px; /* Space for toolbar */
        }

        /* Toolbar floating */
        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .toolbar-info {
            display: flex;
            flex-direction: column;
        }

        .toolbar-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .toolbar-subtitle {
            font-size: 0.85rem;
            color: #475569;
            font-weight: 500;
        }

        .toolbar-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .copies-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .select-input {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1.5px solid #cbd5e1;
            background-color: #fff;
            font-weight: 600;
            color: var(--text-dark);
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .select-input:focus {
            border-color: var(--primary-color);
        }

        .btn {
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #fff;
            box-shadow: 0 4px 10px rgba(15, 118, 110, 0.2);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
            color: #0f172a;
        }

        /* Card / Page Letter preview */
        .page-preview {
            width: 21.59cm;
            min-height: 27.94cm;
            background: #fff;
            margin: 20px auto;
            padding: 1.5cm;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            box-sizing: border-box;
        }

        .page-preview::after {
            content: "Previsualización Hoja Carta (Impresión LAESH)";
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Wrapper for the Report Image styled like the water credentials */
        .report-wrapper {
            width: 16.5cm;
            height: 21cm;
            margin: 0.5cm auto;
            border: 1.5px dashed var(--border-guide);
            border-radius: 6px;
            padding: 10px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            position: relative;
            transition: opacity 0.3s ease;
        }

        .report-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .report-logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .report-logo-img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1.5px solid var(--primary-light);
            object-fit: cover;
        }

        .report-logo-text {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .report-meta-box {
            font-size: 0.75rem;
            text-align: right;
            line-height: 1.3;
        }

        .report-main-img {
            width: 100%;
            height: 17.5cm;
            object-fit: contain;
            display: block;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
        }

        /* Scissor/Cut Guideline top */
        .report-wrapper::before {
            content: "✂️ Guía de Corte de Reporte Digital";
            position: absolute;
            top: -20px;
            left: 0;
            font-size: 0.65rem;
            color: #64748b;
            font-weight: 600;
        }

        /* Printing overrides */
        @media print {
            @page {
                size: letter portrait;
                margin: 0;
            }

            body {
                background: #fff !important;
                padding-top: 0 !important;
            }

            .no-print {
                display: none !important;
            }

            .page-preview {
                width: 100% !important;
                min-height: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                margin: 0 !important;
                padding: 1.5cm !important;
            }

            .page-preview::after {
                display: none !important;
            }

            .report-wrapper {
                width: 100% !important;
                height: auto !important;
                border: 1.5px dashed #718096 !important;
                page-break-inside: avoid;
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <!-- Floating toolbar -->
    <div class="toolbar no-print">
        <div class="toolbar-info">
            <span class="toolbar-title">Impresión de Orden de Laboratorio</span>
            <span class="toolbar-subtitle">
                Folio: <strong id="val-folio">...</strong> | Paciente: <strong id="val-paciente">...</strong>
            </span>
        </div>

        <div class="toolbar-controls">
            <div class="copies-selector">
                <label for="copies">Copias en hoja:</label>
                <select id="copies" class="select-input" onchange="toggleCopies(this.value)">
                    <option value="1">1 Copia</option>
                    <option value="2" selected>2 Copias (Frente/Reverso)</option>
                </select>
            </div>

            <button class="btn btn-primary" onclick="window.print()">
                <span>🖨️</span> Imprimir orden
            </button>

            <button class="btn btn-danger" onclick="window.close()">
                Cerrar
            </button>
        </div>
    </div>

    <!-- Letter preview area -->
    <div class="page-preview">
        <!-- Copy 1 -->
        <div class="report-wrapper" id="rep-1">
            <div class="report-header">
                <div class="report-logo-section">
                    <img src="assets/img/logo.png" class="report-logo-img" alt="LAESH Logo">
                    <span class="report-logo-text">LAESH Clinical Lab</span>
                </div>
                <div class="report-meta-box">
                    <div><strong>Folio:</strong> <span class="lbl-folio">LSH-XXXX</span></div>
                    <div><strong>Paciente:</strong> <span class="lbl-paciente">Ana Gómez</span></div>
                    <div><strong>Estudios:</strong> <span class="lbl-estudios">Hematología</span></div>
                </div>
            </div>
            <img src="assets/img/resultado.png" class="report-main-img" alt="Resultado Digitalizado">
        </div>

        <!-- Copy 2 -->
        <div class="report-wrapper" id="rep-2" style="margin-top: 1.5cm;">
            <div class="report-header">
                <div class="report-logo-section">
                    <img src="assets/img/logo.png" class="report-logo-img" alt="LAESH Logo">
                    <span class="report-logo-text">LAESH Clinical Lab (Copia Expediente)</span>
                </div>
                <div class="report-meta-box">
                    <div><strong>Folio:</strong> <span class="lbl-folio">LSH-XXXX</span></div>
                    <div><strong>Paciente:</strong> <span class="lbl-paciente">Ana Gómez</span></div>
                    <div><strong>Estudios:</strong> <span class="lbl-estudios">Hematología</span></div>
                </div>
            </div>
            <img src="assets/img/resultado.png" class="report-main-img" alt="Resultado Digitalizado">
        </div>
    </div>

    <script>
        // Parse GET parameters
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id') || 'LSH-0000';
        const paciente = urlParams.get('paciente') || 'Paciente Desconocido';
        const estudios = urlParams.get('estudios') || 'Hematología Especializada';

        // Update titles
        document.getElementById('val-folio').innerText = id;
        document.getElementById('val-paciente').innerText = paciente;

        document.querySelectorAll('.lbl-folio').forEach(el => el.innerText = id);
        document.querySelectorAll('.lbl-paciente').forEach(el => el.innerText = paciente);
        document.querySelectorAll('.lbl-estudios').forEach(el => el.innerText = estudios);

        function toggleCopies(val) {
            const num = parseInt(val, 10);
            for (let i = 1; i <= 2; i++) {
                const el = document.getElementById('rep-' + i);
                if (i <= num) {
                    el.style.display = 'flex';
                } else {
                    el.style.display = 'none';
                }
            }
        }
        
        // Init default 2 copies
        toggleCopies(2);
    </script>
</body>
</html>
