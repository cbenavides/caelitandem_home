; ============================================================
;  restaurantb.ini — Configuración PHP para contenedor Docker
;  Base: php:8.3-apache
;
;  Adaptado de: opt-xampp7.4.33/php.ini (XAMPP Windows 10)
;  Autor original: cbm 2026  |  Adaptación Docker: 2026-06-10
;
;  REGLAS DE ADAPTACIÓN:
;    ✅ APLICADO   — válido para PHP 8.3 en Linux/Docker
;    🔄 ADAPTADO   — concepto válido, ruta/valor ajustado al contenedor
;    ❌ COMENTADO  — exclusivo de Windows/XAMPP/PHP 5.x, no aplica
;    ℹ️  NATIVO     — Docker/PHP 8.3 ya lo gestiona por defecto
; ============================================================

; ── MOTOR ────────────────────────────────────────────────────
engine          = On                     ; ✅ Igual
; short_open_tag desactivado es mejor práctica
short_open_tag  = Off                    ; ✅ Igual (PHP 8.3 default)
precision       = 14                     ; ✅ Igual
output_buffering = 4096                  ; ✅ Igual
zlib.output_compression = Off            ; ✅ Igual
implicit_flush  = Off                    ; ✅ Igual
zend.enable_gc  = On                     ; ✅ Igual
zend.exception_ignore_args = Off         ; ✅ Igual
serialize_precision = -1                 ; ✅ Igual (PHP 8 default)

; ── LÍMITES DE RECURSOS ───────────────────────────────────────
; Adaptados del php.ini original (memory_limit=512M, etc.)
max_execution_time   = 120               ; ✅ Adaptado de 120s original
max_input_time       = 60               ; ✅ Igual
max_input_vars       = 5000             ; ✅ Igual (requerido por Agua)
memory_limit         = 512M             ; ✅ Igual — era 512M en original

; ── MANEJO DE ERRORES Y LOGGING ──────────────────────────────
; Modo producción: log sí, pantalla no
error_reporting          = E_ALL & ~E_DEPRECATED & ~E_STRICT
                                         ; 🔄 Original era E_ALL (dev).
                                         ;    En contenedor producción → filtrado
display_errors           = Off          ; 🔄 Original = On (dev XAMPP)
                                         ;    En contenedor → Off (seguridad)
display_startup_errors   = Off          ; 🔄 Original = On. Off en prod
log_errors               = On           ; ✅ Igual
log_errors_max_len       = 1024         ; ✅ Igual
ignore_repeated_errors   = Off          ; ✅ Igual
ignore_repeated_source   = Off          ; ✅ Igual
report_memleaks          = On           ; ✅ Igual

; Log de errores PHP → montado en volumen logs/apache/
error_log = /var/log/apache2/php_errors.log
                                         ; 🔄 Original: F:\xampp\php\logs\php_error_log
                                         ;    En Docker → ruta del volumen Apache

; ── CHARSET Y DATOS ──────────────────────────────────────────
variables_order  = "GPCS"               ; ✅ Igual
request_order    = "GP"                 ; ✅ Igual
register_argc_argv = Off                ; ✅ Igual
auto_globals_jit = On                   ; ✅ Igual
post_max_size    = 40M                  ; ✅ Igual (era 40M en original)
default_mimetype = "text/html"          ; ✅ Igual
default_charset  = "UTF-8"             ; ✅ Igual

; ── ZONA HORARIA ─────────────────────────────────────────────
; Changes by cbm 2026 — mantenido
[Date]
date.timezone = America/Mexico_City     ; ✅ Igual — cbm 2026

; ── UPLOADS ──────────────────────────────────────────────────
file_uploads         = On               ; ✅ Igual
; upload_tmp_dir: Docker usa /tmp por defecto (no necesita ajuste)
; Original: upload_tmp_dir = "F:\xampp\tmp"  ← ❌ Windows, no aplica
upload_max_filesize  = 40M             ; ✅ Igual
max_file_uploads     = 20              ; ✅ Igual

; ── FOPEN / URLs ─────────────────────────────────────────────
allow_url_fopen    = On                 ; ✅ Igual
allow_url_include  = Off                ; ✅ Igual (seguridad)
default_socket_timeout = 60            ; ✅ Igual

; ── SEGURIDAD ────────────────────────────────────────────────
expose_php = Off                        ; 🔄 Original = On. Off para producción
; ❌ safe_mode, register_globals, magic_quotes — eliminados en PHP 5.4+
; ❌ asp_tags, y2k_compliance, track_errors — removidos en PHP 8.x
; ❌ allow_call_time_pass_reference — eliminado en PHP 5.4+

; ── EXTENSIONES ──────────────────────────────────────────────
; En Docker php:8.3-apache, las extensiones se instalan vía
; docker-php-ext-install en el Dockerfile (no via extension= aquí)
; Las siguientes ya están compiladas en la imagen:
;   ✅ pdo_mysql  — instalada en Dockerfile
;   ✅ mysqli     — instalada en Dockerfile
;   ✅ gd         — instalada en Dockerfile
;   ✅ zip        — instalada en Dockerfile
;   ✅ bcmath     — instalada en Dockerfile
;   ✅ mbstring   — instalada en Dockerfile
;   ✅ curl       — incluida en imagen base
;   ✅ fileinfo   — incluida en imagen base
;   ✅ openssl    — incluida en imagen base

; ❌ extension=bz2          — Windows DLL (.dll), no aplica en Linux
; ❌ extension=gd2          — Windows específico, en Linux es 'gd'
; ❌ extension=gettext      — no requerida por restaurantb
; ❌ extension=pdo_sqlite   — no requerida
; ❌ extension=php_openssl.dll — Windows DLL, no aplica
; ❌ extension=php_ftp.dll  — Windows DLL, no aplica
; ❌ extension_dir          — Docker gestiona rutas de extensiones
; ❌ include_path F:\xampp  — ruta Windows, no aplica

; ── MYSQL / PDO ──────────────────────────────────────────────
[MySQLi]
mysqli.max_persistent    = -1           ; ✅ Igual
mysqli.allow_persistent  = On          ; ✅ Igual
mysqli.max_links         = -1          ; ✅ Igual
; En Docker el socket no aplica — conexión vía TCP al servicio 'db'
; Original: mysqli.default_socket = "MySQL"  ← ❌ Named pipe Windows
mysqli.default_port      = 3306        ; ✅ Igual (MariaDB interno en 3306)
mysqli.default_socket    =             ; 🔄 Vacío — usa TCP en contenedor

[Pdo_mysql]
; Original: pdo_mysql.default_socket="MySQL"  ← ❌ Named pipe Windows
pdo_mysql.default_socket =             ; 🔄 Vacío — usa TCP en contenedor

; ── SESIONES ─────────────────────────────────────────────────
[Session]
session.save_handler     = files       ; ℹ️ Default Docker
session.gc_probability   = 1           ; ℹ️ Default
session.gc_divisor       = 1000        ; ✅ Adaptado (mejor que 100)
session.gc_maxlifetime   = 1440        ; ℹ️ Default
session.cookie_httponly  = On          ; 🔄 Añadido: seguridad cookies
session.use_strict_mode  = 1           ; 🔄 Añadido: protección session fixation
session.sid_bits_per_character = 5     ; ✅ Igual (producción)

; ── MAIL (no requerido — comentado para referencia) ──────────
; ❌ SMTP / smtp_port — directivas Windows, no aplican en Linux
; En contenedor Linux usar sendmail_path o un relay SMTP externo
; sendmail_path = /usr/sbin/sendmail -t -i

; ── ODBC (no requerido) ──────────────────────────────────────
; ❌ ODBC — no se usa en restaurantb, omitido completamente

; ── CLI Server ───────────────────────────────────────────────
[CLI Server]
cli_server.color = On                  ; ✅ Igual

; ── PCRE ─────────────────────────────────────────────────────
[Pcre]
; Valores default de PHP 8.3 son adecuados
;pcre.backtrack_limit = 100000
;pcre.recursion_limit = 100000
;pcre.jit = 1
