; ============================================================
;  php-fpm-pool.conf — Pool PHP-FPM tuneado para restaurantb
;  Montado en: /usr/local/etc/php-fpm.d/zz-restaurantb.conf
;  Prefijo zz- → sobreescribe www.conf (carga en último lugar)
;
;  Referencia de sizing (pm = dynamic):
;    pm.max_children    = RAM disponible para FPM / memoria por proceso
;    Proceso PHP típico ≈ 30–60 MB con las extensiones del proyecto.
;    Con 512MB asignados a FPM → max_children ≈ 10–15 conservador.
;    Con 1GB → max_children ≈ 20.
;
;  Ajustar pm.max_children según RAM real del host Docker.
;  Autor: cbm 2026-08-20
; ============================================================

[www]

; ── Process Manager ────────────────────────────────────────
; dynamic: spawna workers según demanda (no wastes RAM en idle)
pm                        = dynamic
pm.max_children           = 20    ; max procesos PHP concurrentes
pm.start_servers          = 4     ; workers al arranque
pm.min_spare_servers      = 2     ; idle mínimo (respuesta rápida a ráfagas)
pm.max_spare_servers      = 10    ; idle máximo (evita workers zombis)
pm.max_requests           = 500   ; reiniciar worker tras N requests (previene memory leaks)

; ── FPM Status & Slow log ───────────────────────────────────
; Status page para monitoreo: curl https://localhost:8443/fpm-status
; (requiere location en Nginx: location = /fpm-status { fastcgi_pass $fpm; ... })
pm.status_path            = /fpm-status

; Slow log — registra requests PHP que superen el umbral
; Volumen: logs/php-fpm/ (montado en docker-compose.yml)
slowlog                   = /var/log/php-fpm/php_slow.log
request_slowlog_timeout   = 10s    ; log si request PHP tarda > 10s

; ── Logging de workers ─────────────────────────────────────
; Redirige stderr de los workers al log de FPM
catch_workers_output      = yes

; ── PHP flags por pool (complementan php-restaurantb.ini) ──
php_flag[display_errors]            = off
php_admin_value[error_log]          = /var/log/php-fpm/php_errors.log
php_admin_flag[log_errors]          = on
; Asegurar que el memory_limit del pool no supere el global
php_admin_value[memory_limit]       = 512M
