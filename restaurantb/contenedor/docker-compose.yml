# ============================================================
#  docker-compose.yml — restaurantb  (Nginx + PHP-FPM Stack)
#  Servicios:
#    nginx    — Nginx 1.27-alpine (HTTP/HTTPS, proxy WS, static)
#    php-fpm  — PHP 8.3-FPM-alpine (extensiones del proyecto)
#    db       — MariaDB 11 LTS
#    pma      — phpMyAdmin (acceso web a MariaDB)
#    vosk     — VOSK ASR offline (WebSocket voz)
#    swoole   — Swoole v6 WebSocket (LAESH notificaciones)
#
#  Puertos:
#    WEB_HTTP_PORT=6001   → https://localhost:6001  (redirect a HTTPS)
#    WEB_HTTPS_PORT=8443  → https://localhost:8443
#    DB_PORT=6002         → mysql -h <ip_host> -P 6002
#    PMA_PORT=6080        → http://localhost:6080
#    VOSK_PORT=2700       → ws://localhost:2700
#    SWOOLE_PORT=6003     → (interno — proxy vía Nginx /ws)
#
#  URLs locales (sin cambios funcionales):
#    https://localhost:8443/restaurant/sistema
#    https://localhost:8443/laesh/
#    https://localhost:8443/laesh/md
#    https://localhost:8443/laesh/rc
#    https://localhost:8443/laesh/adrc
#
#  Uso:
#    cd contenedor/
#    docker compose up -d --build    # Primera vez (build php-fpm)
#    docker compose up -d            # Arranques posteriores
#    docker compose down
#    docker compose logs -f nginx
#    docker compose logs -f php-fpm
# ============================================================

name: restaurantb

services:

  # ── Servidor Web: Nginx 1.27 (reemplaza PHP+Apache anterior) ─
  nginx:
    image: nginx:1.27-alpine
    container_name: restaurantb_nginx
    restart: unless-stopped
    depends_on:
      php-fpm:
        condition: service_started
      swoole:
        condition: service_started
    ports:
      - "${WEB_HTTP_PORT:-6001}:80"
      - "${WEB_HTTPS_PORT:-8443}:443"
    volumes:
      # Configuración Nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Certificado SSL (server.crt + server.key del volumen existente)
      - ../ssl:/etc/nginx/ssl:ro
      # Contenido web (ro — Nginx solo lee estáticos)
      - ../www:/var/www/html:ro
      # Logs
      - ../logs/nginx:/var/log/nginx:rw
    networks:
      - restaurantb_net
    healthcheck:
      # BusyBox wget en alpine no soporta HTTPS — usar nc para verificar que
      # Nginx escucha en los puertos 80 y 443 dentro del contenedor.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 && nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── PHP-FPM: PHP 8.3-FPM-alpine ──────────────────────────
  #    Antes era parte de la imagen web combinada (Apache+FPM)
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile
    image: restaurantb_phpfpm:latest
    container_name: restaurantb_phpfpm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "9000"   # Solo interno — Nginx conecta por red Docker
    volumes:
      # Contenido web (rw — PHP-FPM necesita escribir sesiones, uploads, logs app)
      - ../www:/var/www/html:rw
      # Logs PHP-FPM
      - ../logs/php-fpm:/var/log/php-fpm:rw
    environment:
      # Variables de entorno para las apps PHP
      DB_HOST: db
      DB_PORT: "3306"
      TZ: America/Mexico_City
    networks:
      - restaurantb_net

  # ── Base de Datos: MariaDB 11 LTS ────────────────────────
  #    Sin cambios respecto a versión anterior
  db:
    image: mariadb:11.8.8
    container_name: restaurantb_db
    restart: unless-stopped
    ports:
      - "0.0.0.0:${DB_PORT:-6002}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MARIADB_DATABASE:      "${MARIADB_DATABASE}"
      MARIADB_USER:          "${MARIADB_USER}"
      MARIADB_PASSWORD:      "${MARIADB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql:rw
      - ../logs/mariadb:/var/log/mysql:rw
      - ../bd/init:/docker-entrypoint-initdb.d:ro
      - ./conf/mariadb-restaurantb.cnf:/etc/mysql/conf.d/restaurantb.cnf:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --bind-address=0.0.0.0
    networks:
      - restaurantb_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── phpMyAdmin — Acceso web a MariaDB ────────────────────
  pma:
    image: phpmyadmin:5.2-apache
    container_name: restaurantb_pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:${PMA_PORT:-6080}:80"
    volumes:
      - ./conf/pma-config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    environment:
      PMA_HOST:    db
      PMA_PORT:    3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT:  40M
      TZ:          America/Mexico_City
    networks:
      - restaurantb_net

  # ── Vosk Server (ASR Offline) ─────────────────────────────
  #    Sin cambios — acceso WS directo sin pasar por Nginx
  vosk:
    image: alphacep/kaldi-es:latest
    container_name: restaurantb_vosk
    restart: unless-stopped
    ports:
      - "0.0.0.0:${VOSK_PORT:-2700}:2700"
    environment:
      TZ: America/Mexico_City
    networks:
      - restaurantb_net

  # ── Swoole Server (Real-Time WebSockets) ─────────────────
  #    Acceso WS (vía proxy Nginx): wss://localhost:8443/ws
  #    Bridge HTTP (interno):       http://swoole:9502/publish
  swoole:
    image: phpswoole/swoole:6.2.2-php8.3-alpine
    container_name: laesh_swoole
    restart: unless-stopped
    ports:
      # Puerto directo expuesto como fallback secundario
      - "0.0.0.0:${SWOOLE_PORT:-6003}:9502"
    volumes:
      - ../www:/var/www/html:rw
    working_dir: /var/www/html/laesh-swbldi
    command: php commons/swoole_server.php
    networks:
      - restaurantb_net

# ── Red Dedicada ──────────────────────────────────────────────
networks:
  restaurantb_net:
    driver: bridge

# ── Volúmenes ─────────────────────────────────────────────────
volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../bd/data
