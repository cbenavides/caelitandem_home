# ============================================================
#  nginx.conf — Configuración base Nginx para restaurantb
#  Stack: Nginx 1.27-alpine + PHP 8.3-FPM
#  Reemplaza: Apache 2.4 (mod_php / mod_proxy)
#  Autor: cbm 2026-08-19
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;   # No exponer versión Nginx

    # ── Tamaño máximo de body/upload ────────────────────────────
    # Debe coincidir con upload_max_filesize y post_max_size en php.ini (40M)
    # Sin esto Nginx devuelve 413 para cualquier upload > 1M (default)
    client_max_body_size  40M;

    # ── Gzip global ─────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   4;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript
        image/svg+xml application/xml;

    # ── Formato de log ───────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

    # ── Timeouts FPM (max_execution_time=120s en php.ini) ───
    fastcgi_read_timeout  130s;
    fastcgi_send_timeout  130s;

    # ── Buffers FPM (default 8 8k es insuficiente para respuestas PHP grandes)
    fastcgi_buffers       16 16k;
    fastcgi_buffer_size   32k;

    include /etc/nginx/conf.d/*.conf;
}
