# ==============================================================================
# nginx-laesh-oci-extra.conf — Complemento LAESH para el server{} caelitandem.lat (VM OCI)
#
# Instalado por bootstrap_oci_laesh.sh en /etc/nginx/snippets/ e incluido con UNA
# línea dentro del server{} 443 existente (el resto del sitio — kanboard, n8n,
# caelitandem-home, /mvps — no se toca).
#
# PDFs de resultados: GET /laesh/{md,rc}/orden/pdf valida RBAC en PHP y responde
# X-Accel-Redirect: /laesh-uploads/pdfs/<archivo> — misma ruta interna que KVM2
# (setup/deploy/laesh-kvm2-prod/configs/nginx-laesh-domain.conf).
# ==============================================================================

location /laesh-uploads/pdfs/ {
    internal;
    alias /opt/laesh/uploads/pdfs/;
    add_header Cache-Control "private, no-store" always;
}
