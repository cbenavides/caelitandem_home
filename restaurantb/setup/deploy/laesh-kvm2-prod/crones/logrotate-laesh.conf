# ==============================================================================
# LAESH Bloc Digital — logrotate config
# Target: /etc/logrotate.d/laesh
# Cubre: nginx, php-fpm, swoole, mariadb (slow/error)
# ==============================================================================

/opt/laesh/logs/nginx-access.log
/opt/laesh/logs/nginx-error.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        # Reload Nginx para que abra el nuevo archivo de log
        if [ -f /run/nginx.pid ]; then
            kill -USR1 $(cat /run/nginx.pid)
        fi
    endscript
}

/opt/laesh/logs/php-fpm-error.log
/opt/laesh/logs/php-fpm-slow.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        # Reload PHP-FPM para que reabra logs
        if [ -f /run/php/php8.3-fpm.pid ]; then
            kill -USR1 $(cat /run/php/php8.3-fpm.pid)
        fi
    endscript
}

/opt/laesh/logs/swoole.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        # Swoole long-running: SIGUSR1 para reabrir log
        systemctl kill -s USR1 swoole-laesh.service 2>/dev/null || true
    endscript
}

/opt/laesh/logs/mariadb-error.log
/opt/laesh/logs/mariadb-slow.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 mysql adm
    sharedscripts
    postrotate
        # Flush logs en MariaDB para que reabra archivos rotados
        mariadb --defaults-extra-file=/opt/laesh/configs/.mariadb-root.cnf \
            -e "FLUSH SLOW LOGS; FLUSH ERROR LOGS;" 2>/dev/null || true
    endscript
}

/opt/laesh/logs/install_*.log {
    monthly
    missingok
    rotate 6
    compress
    notifempty
}
