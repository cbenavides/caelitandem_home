# ==============================================================================
# LAESH Bloc Digital — logrotate config
# Target: /etc/logrotate.d/laesh
# Cubre: nginx, php-fpm, swoole, mariadb (slow/error)
# ==============================================================================

/opt/laesh/logs/nginx-access.log
/opt/laesh/logs/nginx-error.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        # Reload Nginx para que abra el nuevo archivo de log
        if [ -f /run/nginx.pid ]; then
            kill -USR1 $(cat /run/nginx.pid)
        fi
    endscript
}

/opt/laesh/logs/php-fpm-error.log
/opt/laesh/logs/php-fpm-slow.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        # Reload PHP-FPM para que reabra logs
        if [ -f /run/php/php8.3-fpm.pid ]; then
            kill -USR1 $(cat /run/php/php8.3-fpm.pid)
        fi
    endscript
}

/opt/laesh/logs/swoole.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        # Swoole long-running: SIGUSR1 para reabrir log
        systemctl kill -s USR1 swoole-laesh.service 2>/dev/null || true
    endscript
}

/opt/laesh/logs/mariadb-error.log
/opt/laesh/logs/mariadb-slow.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 mysql adm
    sharedscripts
    postrotate
        # Flush logs en MariaDB para que reabra archivos rotados
        mariadb --defaults-extra-file=/opt/laesh/configs/.mariadb-root.cnf \
            -e "FLUSH SLOW LOGS; FLUSH ERROR LOGS;" 2>/dev/null || true
    endscript
}

# ── Logs de aplicación (Logger.php → app.log, DB.php → fallback_log) ─────────
# Logger.php escribe LEVEL + message por request; rotación diaria, 30 días.
/opt/laesh/logs/app.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
}

# ── Logs de mantenimiento (crons, backup, cert) ───────────────────────────────
/opt/laesh/logs/cache-renew.log
/opt/laesh/logs/cache-renew-boot.log
/opt/laesh/logs/backup.log
/opt/laesh/logs/cert-check.log
/opt/laesh/logs/disk-monitor.log
/opt/laesh/logs/monitor-services.log
/opt/laesh/logs/alerts-smtp.log
/opt/laesh/logs/apply-log-levels.log {
    weekly
    missingok
    rotate 12
    compress
    delaycompress
    notifempty
    create 0640 root adm
}

# ── Logs de instalación (setup scripts) ──────────────────────────────────────
/opt/laesh/logs/install_*.log {
    monthly
    missingok
    rotate 6
    compress
    notifempty
}
