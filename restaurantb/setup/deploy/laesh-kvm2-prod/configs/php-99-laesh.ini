; ==============================================================================
; LAESH Bloc Digital — PHP 8.3 ini
; Target: /etc/php/8.3/fpm/conf.d/99-laesh.ini
;         /etc/php/8.3/cli/conf.d/99-laesh.ini
; Adaptado de: contenedor/conf/php-restaurantb.ini
; ==============================================================================

; ── Seguridad ──────────────────────────────────────────────────────────────────
expose_php              = Off
display_errors          = Off
display_startup_errors  = Off
log_errors              = On
error_log               = /opt/laesh/logs/php-fpm-error.log
error_reporting         = 22527        ; E_ALL & ~E_DEPRECATED & ~E_STRICT — valor numérico (parser PHP CLI no soporta ~ en ini)

; Funciones peligrosas deshabilitadas (Tecnica_Seguridad_Integral §PHP hardening)
disable_functions = exec,passthru,shell_exec,system,popen,proc_open,pclose,curl_multi_exec,parse_ini_file,show_source,phpinfo

; ── Recursos ───────────────────────────────────────────────────────────────────
memory_limit            = 512M
max_execution_time      = 120
max_input_time          = 90
max_input_vars          = 5000   ; CMS con muchos slots de imagen/texto + formularios Flight
post_max_size           = 45M
upload_max_filesize     = 40M    ; imágenes WebP CMS (límite real: 135 KB en PHP) + PDFs resultados
max_file_uploads        = 20    ; máx archivos por request (alineado al local Docker)

; ── Timezone / Locale ──────────────────────────────────────────────────────────
date.timezone           = America/Mexico_City
default_charset         = UTF-8

; ── Sesiones ───────────────────────────────────────────────────────────────────
session.cookie_httponly = On
session.cookie_secure   = On         ; aplica solo cuando se sirve HTTPS
session.use_strict_mode = 1
session.cookie_samesite = Lax
session.gc_maxlifetime  = 86400      ; 24h (overrideable via SESSION_LIFETIME env var)
session.save_path       = /var/lib/php/sessions

; ── Carga de archivos ──────────────────────────────────────────────────────────
file_uploads            = On

; ── PDO / MySQL ────────────────────────────────────────────────────────────────
pdo_mysql.default_socket = /run/mysqld/mysqld.sock

; ── Sesiones — GC tuning ───────────────────────────────────────────────────────
; gc_divisor controla la probabilidad de GC por request: P = gc_probability / gc_divisor
; Default PHP: 100 (1%) → muy agresivo para servidores con alta concurrencia.
; 1000 (0.1%) reduce llamadas a GC × 10 en picos de tráfico.
; gc_probability default = 1 → no se modifica.
session.gc_divisor      = 1000

; ── Output ─────────────────────────────────────────────────────────────────────
; Buffering explícito (PHP default = 4096, pero mejor declararlo para claridad).
; Mejora TTFB al acumular salida antes de flushear headers. Alineado al local Docker.
output_buffering        = 4096

; ── Misc ───────────────────────────────────────────────────────────────────────
short_open_tag          = Off
allow_url_fopen         = On
allow_url_include       = Off
realpath_cache_size     = 4096K
realpath_cache_ttl      = 600
