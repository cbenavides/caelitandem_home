# ==============================================================================
# LAESH — swaks SMTP Config
# Target: /opt/laesh/configs/swaks.conf
# Permisos: chmod 600 root:root (contiene contraseña SMTP)
# Instalado por 07_security_harden.sh con sed __SMTP_PASS__ → contraseña real.
#
# Uso desde scripts:
#   swaks --config /opt/laesh/configs/swaks.conf \
#         --h-Subject "Asunto" --body "Cuerpo"
#
# Cuenta Yahoo SMTP:
#   Servidor : smtp.mail.yahoo.com:587 (STARTTLS)
#   Remitente: cbena999@yahoo.com.mx  (app-password, no contraseña principal)
#   Destino  : cbena999@gmail.com
#
# Nota de seguridad:
#   __SMTP_PASS__ es una app-password de Yahoo (16 chars).
#   Si se rota, editar este archivo y guardar — los scripts lo leen en cada envío.
#   NO compartir este archivo ni incluirlo en logs/output de ningún script.
# ==============================================================================

--to cbena999@gmail.com
--from cbena999@yahoo.com.mx
--server smtp.mail.yahoo.com
--port 587
--auth LOGIN
--auth-user cbena999@yahoo.com.mx
--auth-password __SMTP_PASS__
--tls
